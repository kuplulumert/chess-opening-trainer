workflows:
  ios-app-store:
    name: iOS App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Name of the App Store Connect API key integration configured under
      # Codemagic Teams > Integrations > Developer Portal. Needs Admin
      # access — App Manager can't create distribution certificates/profiles,
      # which fetch-signing-files below needs to do on the very first build.
      app_store_connect: codemagic-admin
    environment:
      # Signing is handled by the "Set up iOS code signing" script below
      # (app-store-connect fetch-signing-files --create), not Codemagic's
      # declarative ios_signing — that pre-flight check fails outright on a
      # bundle ID with no existing profile yet, before any script gets to run.
      groups:
        # Holds CERTIFICATE_PRIVATE_KEY (secret), configured under this app's
        # Environment variables settings in Codemagic.
        - ios_signing
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: com.kuplulumert.openingtrainer
      node: 22.14.0
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build the web app (root-relative paths for the iOS bundle)
        script: npm run build:ios
      - name: Capacitor sync (copies dist/ into the iOS project)
        script: npx cap sync ios
      - name: Set up iOS code signing
        script: |
          set -x
          keychain initialize
          # First run: no distribution certificate or App Store provisioning
          # profile exists yet for this bundle ID, so create them; later runs
          # just reuse whatever already exists.
          app-store-connect fetch-signing-files "$BUNDLE_ID" --platform IOS --type IOS_APP_STORE --certificate-key=@env:CERTIFICATE_PRIVATE_KEY --create
          keychain add-certificates
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Bump the build number to the next TestFlight build
        script: |
          cd ios/App
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-build-number "$BUNDLE_ID" || echo 0)
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
      - name: Build the .ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Flip this to true once you're ready to send a build straight to
        # App Store review instead of just TestFlight.
        submit_to_app_store: false
